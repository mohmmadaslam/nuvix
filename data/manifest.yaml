# Golden dataset manifest.
# One entry per source recording. Fields marked TBD are filled in during
# ingestion (diarization + manual verification) or need source info from
# whoever downloaded the clip.
#
# NOTE (documented deviation from spec, REVISED 2026-09-26): the task asks
# for 8-10 minute files. Original decision (earlier 2026-09-26) was to use
# full-length original episodes (10.4-19.8 min) rather than trim. That
# decision held for elon-musk-build-the-future (19.5 min) and
# hema-malini-podcast (17.9 min, already mid-transcription when this
# revision happened - left running at full length rather than restarting
# and losing ~45 min of already-completed compute).
#
# For the remaining 3 recordings (illuminati-hindi-explanation,
# raj-shamani-vikas-diviyakirti, gaur-gopal-das-rj-kartik), NOT YET
# INGESTED at the time of this revision, trimmed to their first 6 minutes
# (00:00-06:00 of the original audio) instead - a time-constrained
# processing decision given how slow CPU-only large-v3 transcription is
# proving on this dev machine (see docs/ARCHITECTURE.md Section 8 for the
# production-hardware discussion this motivated). Each trimmed file's
# ORIGINAL full-length audio remains untouched at
# data/audio/<id>.wav (untrimmed) - the manifest's audio_path for these 3
# now points at data/audio/<id>.6min.wav instead. Source videos in
# data/videos/ are unaffected either way (full length, never trimmed).
#
# Net result: the golden dataset now has inconsistent per-file lengths
# (2 files at their full original 17.9-19.5 min length, 3 files trimmed to
# a fixed 6 min) - both deviations from the spec's 8-10 min target, in
# opposite directions, called out explicitly in the submission write-up's
# "limitations" section.
#
# NOTE (licensing): confirmed 2026-09-26 via source URLs below. All 6 are
# from established branded YouTube channels (Y Combinator, BBC World
# Service, Hindi Rush, The Ranveer Show Clips, RJ Kartik, Raj Shamani
# Highlights) publishing under the platform's default "Standard YouTube
# License" (all rights reserved) - none are Creative Commons.
#
# DECISION (2026-09-26): repo will be PRIVATE with reviewer-only access,
# and raw video/audio files ARE committed (plain git, no LFS) since this
# is not public redistribution. This repo must never be made public or
# pushed to a public remote without re-evaluating this decision. See
# docs/ARCHITECTURE.md Section 2.
#
# DROPPED (2026-09-26): bbc-social-media-bans ("Bans on social media and
# phones... BBC World Service"). Its description named 5+ distinct voices
# (unnamed host, journalist Hayley Clarke, correspondent Hannah Ritchie,
# two professors, student vox-pops) - a produced multi-voice segment, not
# a two-person conversation, so it did not satisfy the task's two-speaker
# requirement. Removed rather than swapped in favor of a replacement;
# dataset is 5 files, which is within the task's 5-6 file range. Source
# video file removed from data/videos/ and from git.

