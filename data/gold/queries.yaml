# Gold query set for recall@k / MRR / nDCG evaluation (Task 4).
#
# STATUS: q01-q13 (elon-musk-build-the-future) validated against the
# actual video by the project owner on 2026-09-26.
#
# q14-q24 (illuminati-hindi-explanation) added 2026-09-26, grounded directly
# in the actual Postgres transcript rows (utterances table) rather than the
# source video - timestamps/text/speakers are exact, but relevance has only
# been sanity-checked by re-reading the transcript text, not by watching the
# video the way q01-q13 was. Flag for the project owner to spot-check against
# the actual video if a stricter validation bar is wanted. This is also the
# first file where the corpus is genuinely multilingual end-to-end, so it
# adds the set's first cross_lingual_semantic queries (q18-q19): the same
# "Illuminati"/"Deep State" concepts are spoken in both Latin-script English
# and Devanagari-script Hindi within this one file (sometimes ASR-garbled -
# "Deep Estate" for "Deep State" - see q17), so an English query correctly
# surfacing the Devanagari utterances is a real test of bge-m3's multilingual
# embedding space, not a contrived one.
#
# q25-q35 (raj-shamani-vikas-diviyakirti) added 2026-09-26, same basis as
# q14-q24 (grounded in the actual transcript, not video-verified). Topic:
# what makes someone successful - discipline/perseverance, luck vs. skill by
# field, aptitude, and "flow state". q28 is this file's cross_lingual_semantic
# case: "batsman" (Latin) surfacing "बैटस्पेन" (Devanagari ASR phonetic
# rendering of the same English loanword), a different flavor of cross-script
# match than q18-q19's Illuminati/Deep State pair.
#
# q36-q44 (gaur-gopal-das-rj-kartik) - see the note above q36 (includes a
# speaker-name inversion that was found and fixed before labeling).
#
# Audit 2026-09-26 (after full-corpus eval): negatives are scored as "returns
# nothing anywhere in the corpus". q13 and q22 had been negatives only for
# one file and now have real answers elsewhere, so they were relabeled as
# positives; q23/q34/q35/q43/q44 were duplicates of earlier negatives and
# were replaced with distinct queries confirmed absent from the corpus.
# q13 had been owner-validated as a negative - see its notes field.
#
# Not covered: hema-malini-podcast (unreliable diarization - see README), and
# cross_file_topic queries - no genuinely shared theme exists across the files
# and forcing one would produce a contrived label.
#
# `relevant` is a list of (recording_id, start_ms, end_ms, speaker)
# intervals - a search result counts as a hit if its timestamp falls
# inside one of these windows (+/- a few seconds tolerance, applied by
# the eval code, not here). Empty `relevant: []` = negative query,
# expected to return nothing.
#
# TODO once search/query.py's parser supports speaker:/file: filters:
#   - add true speaker_filtered queries testing the filter syntax itself,
#     not just "a query whose answer happens to have a known speaker".

