# Gold query set for recall@k / MRR / nDCG evaluation (Task 4).
#
# STATUS: q01-q13 (elon-musk-build-the-future) validated against the
# actual video by the project owner on 2026-09-26. Still to add: cross_file
# and cross_lingual categories, plus q01-q13 equivalents for the other 4
# recordings, once they finish ingesting.
#
# `relevant` is a list of (recording_id, start_ms, end_ms, speaker)
# intervals - a search result counts as a hit if its timestamp falls
# inside one of these windows (+/- a few seconds tolerance, applied by
# the eval code, not here). Empty `relevant: []` = negative query,
# expected to return nothing.
#
# TODO once the other 4 files are ingested:
#   - cross_file_topic: a theme discussed in 2+ files
#   - cross_lingual_semantic: an English query surfacing a Hindi-file
#     segment (or vice versa) purely on meaning
#   - re-check negative queries like q13 ("illuminati") still correctly
#     return nothing from THIS file once the actual Illuminati file
#     exists elsewhere in the corpus - a false hit here would be a real bug.
# TODO once search/query.py's parser supports speaker:/file: filters:
#   - add true speaker_filtered queries testing the filter syntax itself,
#     not just "a query whose answer happens to have a known speaker".

